name: Werkzaamheden verversen

# Haalt geplande werkzaamheden op uit de NS-opendata en commit
# werkzaamheden.json als er iets veranderd is. De push triggert daarna
# vanzelf de Pages-deploy. Vereist het repo-secret NS_API_KEY
# (gratis sleutel via https://apiportal.ns.nl, product "Reisinformatie API").

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'   # vier keer per dag (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzaamheden ophalen
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
        run: |
          if [ -z "$NS_API_KEY" ]; then
            echo "::notice::NS_API_KEY-secret ontbreekt; run wordt overgeslagen."
            exit 0
          fi
          python3 werkzaamheden/haal_werkzaamheden.py

      - name: Committen bij wijziging
        run: |
          if git diff --quiet werkzaamheden.json 2>/dev/null; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add werkzaamheden.json
          git commit -m "werkzaamheden.json ververst (NS-opendata)"
          git push
