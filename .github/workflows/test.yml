name: Tests & datavalidatie

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testsuite (parser & routering)
        run: npm test
      - name: Datavalidatie
        run: python3 afstanden_check/valideer_data.py
