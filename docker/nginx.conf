# spotconverter.markeijbaard.nl — nginx-configuratie binnen de container
#
# Dit bestand komt terecht in /etc/nginx/conf.d/default.conf en draait dus
# binnen het http-blok van de standaardconfiguratie van het nginx-image.
#
# TLS, HSTS en het echte bezoekersadres komen van Nginx Proxy Manager; deze
# container luistert alleen op poort 80 binnen het proxy-network en is niet
# rechtstreeks vanaf internet bereikbaar.
#
# Een subdomein, dus geen www-serverblok: spotconverter.markeijbaard.nl heeft
# geen www-variant.

# Het adres van de bezoeker zit in X-Real-IP, gezet door NPM. Zonder deze
# regels staat in elke logregel het interne adres van de proxycontainer.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Real-IP;

# nginx kent .csv niet in mime.types. Zonder deze regel gaan afstanden.csv
# (370 kB) en stations.csv (120 kB) als application/octet-stream de lijn over
# en vallen ze buiten gzip_types — een halve megabyte extra bij elk eerste
# bezoek, op een tool die je juist onderweg langs het spoor gebruikt.
#
# Dit blok moet op http-niveau staan, buiten elk serverblok: op http-niveau
# vult het de al ingelezen mime.types aan, maar een types-blok binnen een
# server vervangt die hele tabel en dan serveert de site álles als octet-stream.
# docker/smoketest.sh controleert daarom expliciet het content-type van een
# HTML-, een CSS- en een CSV-bestand.
types {
    text/csv csv;
}

# Cache-Control per pad, in één map in plaats van losse add_header-regels per
# location. Dat voorkomt de bekende nginx-valkuil dat een add_header in een
# location alle add_headers van het serverblok overschrijft.
#
# Geen 'immutable' op css en js: die bestandsnamen bevatten geen versie
# (spotconverter.css blijft spotconverter.css), dus een terugkerende bezoeker
# zou na een restyling de oude stylesheet houden. Een week is de bovengrens
# van wat de service worker zelf al opvangt — die haalt bij elke versiebump
# zijn precache op met cache:'reload' en gaat dus langs de HTTP-cache heen.
#
# De databestanden staan in de root en vallen daarmee onder 'default':
# max-age=0, must-revalidate. Dat hoort zo — werkzaamheden.json wordt vier keer
# per dag ververst. Hetzelfde geldt voor /sw.js, en dat is essentieel: een
# gecachte service worker zou een release tegenhouden.
map $uri $site_cache {
    default                 "public, max-age=0, must-revalidate";
    ~^/assets/(css|js)/     "public, max-age=604800";
    ~^/assets/              "public, max-age=2592000";
}

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_comp_level   6;
gzip_types        text/plain text/css text/csv text/xml application/xml
                  application/xml+rss application/atom+xml
                  application/javascript application/json
                  image/svg+xml application/manifest+json;

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # NPM beëindigt TLS en stuurt door op http. Zonder deze twee regels bouwt
    # nginx bij een mapredirect een absolute URL met zijn eigen containernaam
    # erin, en belandt de bezoeker op http://spotconverter-site/pad/.
    absolute_redirect off;
    port_in_redirect  off;

    add_header Cache-Control          $site_cache                      always;
    add_header X-Content-Type-Options nosniff                          always;
    add_header X-Frame-Options        SAMEORIGIN                       always;
    add_header Referrer-Policy        strict-origin-when-cross-origin  always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Voor Uptime Kuma. Staat los van de site, zodat een controle elke minuut
    # niet in het toegangslogboek terechtkomt.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # De buildcontext is hier de hele repo (variant B: er is geen build-stap,
    # de repo ís de site). Deze map moet in de context blijven omdat de COPY
    # van nginx.conf hem daaruit haalt, en belandt dus ook in de webroot.
    # Niet uitleveren: dat zou de serverconfiguratie publiek maken.
    location ^~ /docker/ {
        deny all;
    }

    # Verborgen bestanden nooit uitleveren. .well-known blijft er bewust
    # buiten: daar loopt de certificaatcontrole van Let's Encrypt overheen.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
